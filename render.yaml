# Render Blueprint. Connect this repo in Render (New > Blueprint) or create the web service manually
# with the same settings. DATABASE_URL must point at your existing Render PostgreSQL database.
services:
  - type: web
    name: school-management-system
    runtime: node
    plan: starter
    region: singapore # must match your PostgreSQL region so the Internal Database URL works
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Render Postgres *Internal Database URL* in the dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false # Principal login ID, e.g. principal
      - key: ADMIN_PASSWORD
        sync: false # Principal password (min 8 characters); used only to create the first account
      - key: SETUP_TOKEN
        sync: false
